[package]
name = "synapse"
version = "1.0.0"
edition = "2021"
description = "Synapse — The Canonical AI Brain. Scan, import, project, sync, doctor, snapshot, and roll back AI tool configs"
default-run = "synapse"

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
synapse-core = { path = "../../packages/core" }
serde_json = "1.0"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"

[package]
name = "synapse"
version = "1.0.0"
edition = "2021"
description = "SYNAPSE (llm-neuro-surgeon) CLI — scan, import, project, sync, doctor, snapshot, and rollback AI tool configs"

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
neurosurgeon-core = { path = "../../packages/core" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

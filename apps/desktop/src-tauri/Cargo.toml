[package]
name = "desktop-app"
version = "1.0.0"
edition = "2021"
description = "LLM Neurosurgeon desktop application (Tauri core)"


[[bin]]
name = "desktop-app"
path = "src/main.rs"

[lib]
name = "desktopapplib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
directories = "5"
neurosurgeon-core = { path = "../../../packages/core" }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profile is configured in the workspace root (see ../../../Cargo.toml).
# Defining it again here would trigger:
#   warning: profiles for the non root package will be ignored
# which is the symptom of the duplicate table; the workspace root
# carries `panic = "abort"` so the desktop Tauri binary still aborts on panic
# (Tauri-recommended for release) without a local override.

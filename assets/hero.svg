<?xml version="1.0" encoding="UTF-8"?>
<!-- Synapse – LLM NeuroSurgeon hero banner -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="300"
    viewBox="0 0 1200 300"
    preserveAspectRatio="xMidYMid slice"
    role="img"
    aria-labelledby="title desc">

  <title id="title">Synapse – LLM NeuroSurgeon Banner</title>
  <desc id="desc">
    A gradient background with abstract brain‑like synapse lines and the project title.
  </desc>

  <!-- ==================== BACKGROUND ==================== -->
  <defs>
    <!-- Subtle dark‑blue → teal gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Glowing “synapse” line style -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text outline (for crisp display on dark bg) -->
    <filter id="textOutline" x="-0.05" y="-0.05" width="1.1" height="1.1">
      <feMorphology operator="dilate" radius="1" result="dilated"/>
      <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="dilated" operator="in" result="outline"/>
      <feComposite in="SourceGraphic" in2="outline" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- ==================== SYNAPSE NETWORK ==================== -->
  <!-- Abstract brain shape made of curved paths -->
  <g stroke="#4fd1c5" stroke-width="2.5" fill="none" filter="url(#glow)">
    <!-- Left hemisphere -->
    <path d="M250,150
             C180,70 180,230 250,150"/>
    <path d="M250,150
             C210,120 210,180 250,150"/>

    <!-- Right hemisphere -->
    <path d="M950,150
             C1020,70 1020,230 950,150"/>
    <path d="M950,150
             C990,120 990,180 950,150"/>

    <!-- Central bridge (corpus callosum) -->
    <path d="M350,150 Q600,80 850,150"/>
    <path d="M350,150 Q600,220 850,150"/>

    <!-- Random “neuron” spines -->
    <circle cx="400" cy="120" r="4" fill="#4fd1c5"/>
    <circle cx="500" cy="180" r="5" fill="#4fd1c5"/>
    <circle cx="620" cy="110" r="3" fill="#4fd1c5"/>
    <circle cx="720" cy="190" r="4" fill="#4fd1c5"/>
    <circle cx="820" cy="130" r="5" fill="#4fd1c5"/>
  </g>

  <!-- ==================== TITLE TEXT ==================== -->
  <g filter="url(#textOutline)">
    <text
        x="50%" y="50%" 
        dominant-baseline="middle" 
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        fill="#ffffff">
      Synapse – LLM NeuroSurgeon
    </text>
  </g>

  <!-- Optional subtitle (comment out if not needed) -->
  <!--
  <text
      x="50%" y="62%" 
      dominant-baseline="middle" 
      text-anchor="middle"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="22"
      fill="#cbd5e1">
    Cutting‑edge AI Config Neural Surgery
  </text>
  -->
</svg>

name: Desktop build

# Cross-platform build matrix for the Tauri v2 desktop app. Produces the
# unsigned release binaries; signing/notarization is layered on per
# docs/packaging/RELEASE_PACKAGING.md. Release builds enable the
# `os-keychain` feature so secrets land in the OS keychain by default —
# the in-memory store is a dev/test fixture only (docs/security.md).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Toolchain version comes from rust-toolchain.toml at the repo root.

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Tauri v2 system dependencies (Linux only) + libdbus for the
      # keyring secret-service backend.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            build-essential \
            curl wget file libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter desktop-app build

      - name: cargo build --release (CLI, keychain on)
        run: cargo build --release -p neurosurgeon --features neurosurgeon-core/os-keychain

      - name: cargo build --release (desktop, keychain on)
        run: cargo build --release -p desktop-app --features neurosurgeon-core/os-keychain

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: neurosurgeon-${{ matrix.os }}
          path: |
            target/release/neurosurgeon
            target/release/neurosurgeon.exe
            target/release/desktop-app
            target/release/desktop-app.exe
          if-no-files-found: error

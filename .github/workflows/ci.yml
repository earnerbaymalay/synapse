name: CI

# Fast, always-verifiable checks that run on pushes to main and on every
# pull request (feature branches are covered by their PR run, so they are
# not also built on push). The heavier cross-platform release build lives in
# build.yml (tags + workflow_dispatch).
#
# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest so an image
# migration cannot silently change system libraries under the Tauri build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; never cancel a main-branch run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  rust-test:
    name: Rust tests (workspace)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Build desktop frontend (required before cargo test)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter desktop-app build
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # src-tauri's build script needs the system libs and a built frontend
      # (dist/) exactly like rust-test, so clippy mirrors that setup.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Build desktop frontend (required before cargo clippy)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter desktop-app build
      - name: Install clippy
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  javascript-test:
    name: JavaScript tests & desktop build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Desktop tests
        run: pnpm --filter desktop-app test
      - name: Schema tests
        run: pnpm --filter @synapse/schema --fail-if-no-match test
      - name: Desktop production build
        run: pnpm --filter desktop-app build

  e2e-test:
    name: End-to-end suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for E2E
        run: cargo build --package synapse --locked
      - name: End-to-end tests
        run: pnpm --filter @synapse/e2e --fail-if-no-match test

  shell:
    name: Shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          for f in ralph.sh scripts/*.sh; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done
      - name: shellcheck
        run: shellcheck ralph.sh scripts/*.sh

  html:
    name: Brand mock HTML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate brand mocks parse
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import glob, sys
          failed = False
          files = sorted(glob.glob("brands/*/index.html"))
          assert files, "no brand mocks found under brands/*/index.html"
          for f in files:
              try:
                  HTMLParser().feed(open(f, encoding="utf-8").read())
                  print(f"OK   {f}")
              except Exception as e:  # noqa: BLE001
                  failed = True
                  print(f"FAIL {f}: {e}")
          sys.exit(1 if failed else 0)
          PY

  docs:
    name: Docs & state files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Required project files present
        run: |
          python3 - <<'PY'
          import os, sys
          required = [
              "README.md", "CLAUDE.md", ".ai/MASTER_PROMPT.md", ".ai/PLAN.md",
              ".ai/PROGRESS.md", "docs/DECISIONS.md", "docs/DESIGN_PACK.md",
              ".ai/RALPH_PROMPT.md", "docs/CODE_REVIEW.md",
          ]
          missing = [f for f in required if not os.path.isfile(f)]
          for f in required:
              print(("MISSING " if f in missing else "OK      ") + f)
          sys.exit(1 if missing else 0)
          PY
      - name: Recon briefs complete (expect 12)
        run: |
          count=$(find docs/research -maxdepth 1 -name '*.md' | wc -l)
          echo "recon briefs: $count"
          test "$count" -ge 12

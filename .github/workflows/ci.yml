name: CI

# Fast, always-verifiable checks that run on every push and pull request.
# The desktop app builds and tests clean as part of this workflow (see the
# rust-test and rust-clippy jobs below). The heavier cross-platform release
# build lives in build.yml, gated to version tags and manual dispatch by
# design, not because of a compile blocker. docs/CODE_REVIEW.md is a
# historical record of Phase 2/T2.1's state, not a live tracker — see its
# own 2026-07-12 addendum before trusting anything past §1.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  rust-test:
    name: Rust tests (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Build desktop frontend (required before cargo test)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter desktop-app build
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  rust-clippy:
    name: Rust lints (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup clippy component
        run: rustup component add clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Build desktop frontend (required before cargo clippy)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter desktop-app build
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  javascript-test:
    name: JavaScript tests & desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Desktop tests
        run: pnpm --filter desktop-app test
      - name: Schema tests
        run: pnpm --filter @llm-neurosurgeon/schema test
      - name: Desktop production build
        run: pnpm --filter desktop-app build

  e2e-test:
    name: End-to-end suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for E2E
        run: cargo build --package synapse
      - name: End-to-end tests
        run: pnpm --filter @llm-neurosurgeon/e2e test

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: bash -n ralph.sh
      - name: shellcheck
        run: shellcheck ralph.sh

  html:
    name: Brand mock HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate brand mocks parse
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import glob, sys
          failed = False
          files = sorted(glob.glob("brands/*/index.html"))
          assert files, "no brand mocks found under brands/*/index.html"
          for f in files:
              try:
                  HTMLParser().feed(open(f, encoding="utf-8").read())
                  print(f"OK   {f}")
              except Exception as e:  # noqa: BLE001
                  failed = True
                  print(f"FAIL {f}: {e}")
          sys.exit(1 if failed else 0)
          PY

  docs:
    name: Docs & state files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required project files present
        run: |
          python3 - <<'PY'
          import os, sys
          required = [
              "README.md", "CLAUDE.md", ".ai/MASTER_PROMPT.md", ".ai/PLAN.md",
              ".ai/PROGRESS.md", "docs/DECISIONS.md", "docs/DESIGN_PACK.md",
              ".ai/RALPH_PROMPT.md", "docs/CODE_REVIEW.md",
          ]
          missing = [f for f in required if not os.path.isfile(f)]
          for f in required:
              print(("MISSING " if f in missing else "OK      ") + f)
          sys.exit(1 if missing else 0)
          PY
      - name: Recon briefs complete (expect 12)
        run: |
          count=$(find docs/research -maxdepth 1 -name '*.md' | wc -l)
          echo "recon briefs: $count"
          test "$count" -ge 12

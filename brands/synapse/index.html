<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse | LLM Neurosurgeon</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-surface: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #ff7b72;
            --accent-orange: #d29922;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Grid pattern overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(48, 54, 61, 0.15) 40px, rgba(48, 54, 61, 0.15) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(48, 54, 61, 0.15) 40px, rgba(48, 54, 61, 0.15) 41px);
            pointer-events: none;
            z-index: 0;
        }

        .dashboard {
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* Animated gradient bar with shimmer */
        .dashboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            right: 0;
            height: 4px;
            width: 300%;
            background: linear-gradient(90deg, var(--accent-red), var(--accent), var(--accent-green), var(--accent-red), var(--accent), var(--accent-green));
            background-size: 200% 100%;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(0); }
            100% { transform: translateX(-33.33%); }
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.4), 0 0 40px rgba(88, 166, 255, 0.15);
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* ===== STATS GRID ===== */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-block {
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 1.75rem 1rem;
            text-align: center;
            border: 1px solid rgba(48, 54, 61, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        /* Shine animation on hover */
        .stat-block::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.06) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .stat-block:hover::after {
            opacity: 1;
        }

        .stat-block:hover {
            border-color: rgba(88, 166, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.4rem;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* ===== TERMINAL STATUS BAR ===== */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding: 0.9rem 1.25rem;
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 1px solid rgba(48, 54, 61, 0.5);
            font-size: 0.9rem;
        }

        .terminal-prompt {
            color: var(--accent-green);
            font-weight: 600;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.6);
            animation: pulse-dot 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 8px rgba(63, 185, 80, 0.6);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.85);
                box-shadow: 0 0 4px rgba(63, 185, 80, 0.3);
            }
        }

        .terminal-text {
            color: var(--text-primary);
        }

        .terminal-status {
            color: var(--accent-green);
            font-weight: 600;
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--text-secondary);
            animation: cursor-blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== QUICK ACTIONS ===== */
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.85rem 1.25rem;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: #4a94e0;
            border-color: #4a94e0;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(88, 166, 255, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(88, 166, 255, 0.1);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body {
                padding: 0.75rem;
            }

            .dashboard {
                padding: 1.5rem;
                border-radius: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
            }

            .logo {
                font-size: 1.8rem;
            }

            .tagline {
                font-size: 0.8rem;
            }

            .stats-container {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .stat-block {
                padding: 1.25rem 1rem;
            }

            .stat-value {
                font-size: 2rem;
            }

            .actions {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .btn {
                padding: 0.75rem 1rem;
                font-size: 0.8rem;
            }

            .terminal-bar {
                font-size: 0.8rem;
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <!-- HEADER -->
        <div class="header">
            <div class="logo">SYNAPSE</div>
            <div class="tagline">//dev/neural-protocol/processing</div>
        </div>

        <!-- STATS GRID -->
        <div class="stats-container">
            <div class="stat-block">
                <div class="stat-value">3</div>
                <div class="stat-label">Brand Identities</div>
            </div>
            <div class="stat-block">
                <div class="stat-value">100%</div>
                <div class="stat-label">Cross-Platform</div>
            </div>
            <div class="stat-block">
                <div class="stat-value">2.4k</div>
                <div class="stat-label">Lines Configured</div>
            </div>
            <div class="stat-block">
                <div class="stat-value">24/7</div>
                <div class="stat-label">Active Monitoring</div>
            </div>
        </div>

        <!-- TERMINAL STATUS BAR -->
        <div class="terminal-bar">
            <span class="terminal-prompt">$</span>
            <span class="terminal-dot"></span>
            <span class="terminal-text">Brain Status: <span class="terminal-status">Synchronized</span></span>
            <span class="terminal-cursor"></span>
        </div>

        <!-- QUICK ACTIONS -->
        <div class="actions">
            <button class="btn btn-primary">Scan Environment</button>
            <button class="btn btn-outline">Run Doctor</button>
            <button class="btn btn-outline">View Dashboard</button>
        </div>

        <!-- FOOTER -->
        <div class="footer">SYNAPSE v1.0 &mdash; Core Identity Reference</div>

    </div>
</body>
</html>
